<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Mock Technical Interview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0e0f13;
      --panel-bg: #1a1c22;
      --accent: #5b5fef;
      --accent-hover: #4548d1;
      --danger: #d9383a;
      --speaking: #3dd68c;
      --text-main: #f3f4f6;
      --text-muted: #9aa0ab;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .teams-navbar {
      height: 56px;
      background: #16171d;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .call-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .rec-dot {
      width: 9px;
      height: 9px;
      background: #ef4444;
      border-radius: 50%;
      animation: blink 1.5s infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    .teams-toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tool-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.78rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .tool-btn .icon { font-size: 1.05rem; line-height: 1; }

    .tool-btn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
    .tool-btn.active { background: rgba(91, 95, 239, 0.2); color: #a5a8ff; }

    .toolbar-divider {
      width: 1px;
      height: 28px;
      background: var(--border-color);
      margin: 0 8px;
    }

    .leave-btn {
      background: var(--danger);
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      margin-left: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .main-stage {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 14px;
      padding: 14px;
      overflow: hidden;
    }

    .video-grid {
      position: relative;
      height: 100%;
      background: #05060a;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid transparent;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .video-grid.active-speaker {
      border-color: var(--speaking);
      box-shadow: 0 0 0 3px rgba(61, 214, 140, 0.18);
    }

    .human-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .human-container img.headshot {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.02) contrast(1.02);
    }

    .human-container::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 68%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
    }

    .speaking-ring {
      position: absolute;
      inset: 10px;
      border-radius: 8px;
      border: 3px solid var(--speaking);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .active-speaker .speaking-ring { opacity: 1; }

    .participant-overlay {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: rgba(10, 11, 15, 0.72);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }

    .participant-name {
      font-size: 0.85rem;
      font-weight: 500;
    }

    .audio-waves {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 14px;
    }

    .wave-bar {
      width: 3px;
      height: 4px;
      background: var(--text-muted);
      border-radius: 2px;
      transition: background 0.2s;
    }

    .active-speaker .wave-bar {
      background: var(--speaking);
      animation: wave 0.4s infinite ease-in-out alternate;
    }

    .active-speaker .wave-bar:nth-child(2) { animation-delay: 0.1s; }
    .active-speaker .wave-bar:nth-child(3) { animation-delay: 0.2s; }
    .active-speaker .wave-bar:nth-child(4) { animation-delay: 0.3s; }

    @keyframes wave { 0% { height: 3px; } 100% { height: 14px; } }

    .live-tag {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(10, 11, 15, 0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 10;
    }
    .live-tag .rec-dot { width: 7px; height: 7px; }

    .sidebar {
      background: var(--panel-bg);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-color);
      height: 100%;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-header .muted-icon { color: var(--text-muted); font-size: 0.9rem; cursor: pointer; }

    .resume-upload-box {
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid var(--border-color);
    }

    .resume-upload-box label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .resume-upload-box input[type="file"] {
      font-size: 0.76rem;
      color: var(--text-muted);
      max-width: 100%;
    }

    .chat-transcript {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-msg {
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 88%;
      font-size: 0.87rem;
      line-height: 1.45;
    }

    .chat-msg.ai {
      background: #262832;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .chat-msg.user {
      background: var(--accent);
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .chat-input-box {
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
    }

    .chat-input-box input {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      outline: none;
      font-size: 0.85rem;
    }

    .send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
    }

    .send-btn:hover { background: var(--accent-hover); }
  </style>
</head>
<body>

  <header class="teams-navbar">
    <div class="call-info">
      <div class="rec-dot"></div>
      <span id="callTimer">00:00</span>
    </div>

    <div class="teams-toolbar">
      <button class="tool-btn active"><span class="icon">💬</span>Chat</button>
      <button class="tool-btn"><span class="icon">👥</span>People</button>
      <button class="tool-btn"><span class="icon">✋</span>Raise</button>
      <button class="tool-btn"><span class="icon">🙂</span>React</button>
      <div class="toolbar-divider"></div>
      <button class="tool-btn" id="micToggleBtn" onclick="toggleSpeechRecognition()"><span class="icon">🎙️</span>Mic Off</button>
      <button class="leave-btn">📞 Leave</button>
    </div>
  </header>

  <main class="main-stage">
    <div class="video-grid" id="speakerCard">
      <div class="human-container">
        <img class="headshot" alt="David Chen, Lead Technical Interviewer"
             src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=900&auto=format&fit=crop&crop=faces">
        <div class="speaking-ring"></div>
      </div>

      <div class="live-tag"><div class="rec-dot"></div>Recording</div>

      <div class="participant-overlay">
        <div class="audio-waves" id="audioWaves">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
        <span class="participant-name">David Chen (Lead Technical Interviewer)</span>
      </div>
    </div>

    <aside class="sidebar">
      <div class="sidebar-header">
        <span>Transcript & Chat</span>
        <span class="muted-icon">✕</span>
      </div>

      <div class="resume-upload-box">
        <label>📄 Upload candidate resume (PDF)</label>
        <input type="file" id="resumeFile" accept=".pdf" onchange="uploadResume(event)">
      </div>

      <div class="chat-transcript" id="chatLogs">
        <div class="chat-msg ai">Hello! Thanks for joining the interview. Could you please upload your resume and introduce yourself?</div>
      </div>

      <div class="chat-input-box">
        <input type="text" id="userInput" placeholder="Type your response..." onkeypress="handleKey(event)">
        <button class="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </aside>
  </main>

  <script>
    // Paste your full Production n8n Webhook URL here
    const TEST_WEBHOOK_URL = 'https://ai-mock-interviewer-1-2zng.onrender.com/webhook/mock-interview';
    
    let isListening = false;
    let recognition;

    let isResumeUploaded = false;
    let uploadedResumeName = "";

    let elapsed = 0;
    setInterval(() => {
      elapsed++;
      const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const s = String(elapsed % 60).padStart(2, '0');
      document.getElementById('callTimer').innerText = `${m}:${s}`;
    }, 1000);

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRec();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        document.getElementById('userInput').value = text;
        sendMessage();
      };

      recognition.onend = () => {
        isListening = false;
        const btn = document.getElementById('micToggleBtn');
        btn.innerHTML = '<span class="icon">🎙️</span>Mic Off';
        btn.classList.remove('active');
      };
    }

    function toggleSpeechRecognition() {
      if (!recognition) return alert('Speech recognition is not supported in this browser.');
      const btn = document.getElementById('micToggleBtn');
      if (!isListening) {
        recognition.start();
        isListening = true;
        btn.innerHTML = '<span class="icon">🎙️</span>Listening...';
        btn.classList.add('active');
      } else {
        recognition.stop();
      }
    }

    function speakText(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      const speakerCard = document.getElementById('speakerCard');

      utterance.onstart = () => {
        speakerCard.classList.add('active-speaker');
      };

      utterance.onend = () => {
        speakerCard.classList.remove('active-speaker');
      };

      window.speechSynthesis.speak(utterance);
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      appendMsg(text, 'user');
      input.value = '';

      const payload = {
        chatInput: text,
        sessionId: 'live-call-session',
        resumeUploaded: isResumeUploaded,
        resumeName: uploadedResumeName
      };

      try {
        const res = await fetch(TEST_WEBHOOK_URL, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          throw new Error(`HTTP Error Status: ${res.status}`);
        }

        const data = await res.json();
        const reply = data.output || "Thank you. Let's move to the next question.";
        appendMsg(reply, 'ai');
        speakText(reply);
      } catch (err) {
        console.error("SendMessage Error:", err);
        appendMsg(`Error connecting to server (${err.message})`, 'ai');
      }
    }

    async function uploadResume(e) {
      const file = e.target.files[0];
      if (!file) return;

      isResumeUploaded = true;
      uploadedResumeName = file.name;

      const formData = new FormData();
      formData.append('data', file, file.name);
      formData.append('file', file, file.name);
      formData.append('sessionId', 'live-call-session');
      formData.append('isResume', 'true');
      formData.append('resumeUploaded', 'true');

      appendMsg(`Uploading resume: ${file.name}...`, 'user');

      try {
        const res = await fetch(TEST_WEBHOOK_URL, { 
          method: 'POST', 
          body: formData 
        });

        if (!res.ok) {
          throw new Error(`HTTP Error Status: ${res.status}`);
        }

        const data = await res.json();
        const reply = data.output || "Resume received! What job role or domain are you preparing for?";
        appendMsg(reply, 'ai');
        speakText(reply);
      } catch (err) {
        console.error("UploadResume Error:", err);
        appendMsg(`Failed to process resume (${err.message})`, 'ai');
      }
    }

    function appendMsg(text, sender) {
      const logs = document.getElementById('chatLogs');
      const div = document.createElement('div');
      div.className = `chat-msg ${sender}`;
      div.innerText = text;
      logs.appendChild(div);

      requestAnimationFrame(() => {
        logs.scrollTop = logs.scrollHeight;
      });
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendMessage();
    }
  </script>
</body>
</html>
